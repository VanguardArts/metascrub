app-id: com.vanguardarts.Metascrub
runtime: org.kde.Platform
runtime-version: '6.7'
sdk: org.kde.Sdk
command: metascrub-gui
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=home
modules:
  - name: python-deps
    buildsystem: simple
    build-commands:
      - pip3 install --no-deps --prefix=${FLATPAK_DEST} mutagen pyyaml
  - name: metascrub
    buildsystem: simple
    build-commands:
      - install -dm755 ${FLATPAK_DEST}/lib/metascrub
      - cp -r src/metascrub ${FLATPAK_DEST}/lib/metascrub/
      - cp packaging/cli_main.py packaging/gui_main.py ${FLATPAK_DEST}/lib/metascrub/
      - install -Dm755 ${FLATPAK_DEST}/lib/metascrub/cli_main.py ${FLATPAK_DEST}/bin/metascrub
      - install -Dm755 ${FLATPAK_DEST}/lib/metascrub/gui_main.py ${FLATPAK_DEST}/bin/metascrub-gui
      - install -Dm644 packaging/metascrub.desktop ${FLATPAK_DEST}/share/applications/com.vanguardarts.Metascrub.desktop
      - install -Dm644 packaging/metascrub.svg ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/com.vanguardarts.Metascrub.svg
      - install -Dm644 packaging/flatpak/com.vanguardarts.Metascrub.metainfo.xml ${FLATPAK_DEST}/share/metainfo/com.vanguardarts.Metascrub.metainfo.xml
    sources:
      - type: dir
        path: .
