name: Build installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Qt runtime libraries (headless)
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libfontconfig1 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-image0 libxcb-render-util0 libdbus-1-3

      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      # Qt's offscreen platform can crash at interpreter teardown on CI
      # runners, *after* all tests passed -> judge by the JUnit report,
      # not pytest's process exit code.
      - name: Run test suite
        run: |
          set +e
          QT_QPA_PLATFORM=offscreen python -m pytest tests/ -q \
            --junitxml=test-results.xml
          echo "pytest process exit code: $?"
          set -e
          python packaging/check_junit.py test-results.xml

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[gui] pyinstaller

      - name: Build CLI binary
        run: |
          pyinstaller --onefile --name metascrub-cli packaging/cli_main.py

      - name: Build GUI app
        run: |
          pyinstaller --onefile --windowed --name metascrub-gui packaging/gui_main.py

      # ---------------- Linux: .deb + AppImage + CLI tarball -------------
      - name: Render icon PNG (linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update && sudo apt-get install -y librsvg2-bin
          rsvg-convert -w 256 -h 256 src/metascrub/gui/assets/icon.svg \
            -o dist/metascrub.png

      - name: Package .deb (linux)
        if: matrix.platform == 'linux'
        run: |
          VERSION="${GITHUB_REF_NAME#v}" DIST_DIR=dist bash packaging/make_deb.sh

      - name: Package AppImage (linux)
        if: matrix.platform == 'linux'
        run: |
          curl -fsSL -o /tmp/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool
          DIST_DIR=dist APPIMAGETOOL=/tmp/appimagetool \
            bash packaging/make_appimage.sh

      - name: Package CLI tarball (unix)
        if: runner.os != 'Windows'
        run: |
          cd dist
          tar czf ../metascrub-cli-${{ matrix.platform }}.tar.gz metascrub-cli

      # ---------------- macOS: .dmg --------------------------------------
      - name: Package .dmg (macos)
        if: matrix.platform == 'macos'
        run: |
          DIST_DIR=dist bash packaging/make_dmg.sh

      # ---------------- Windows: Inno Setup .exe + CLI zip ---------------
      - name: Install Inno Setup (windows)
        if: matrix.platform == 'windows'
        run: choco install innosetup -y --no-progress

      - name: Build installer (windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ver = ${env:GITHUB_REF_NAME}.TrimStart('v')
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=$ver packaging\metascrub.iss

      - name: Package CLI zip (windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: Compress-Archive dist/metascrub-cli.exe metascrub-cli-windows.zip

      # Stage everything into one flat dir: upload-artifact preserves the
      # directory structure relative to the least common ancestor of the
      # paths, so mixed dist/ + root paths would nest files under dist/ and
      # the release globs (flat) would miss them.
      - name: Stage release files (linux)
        if: matrix.platform == 'linux'
        run: |
          mkdir -p artifacts
          mv dist/metascrub_*_amd64.deb dist/metascrub-gui-linux.AppImage artifacts/
          mv metascrub-cli-linux.tar.gz artifacts/

      - name: Stage release files (macos)
        if: matrix.platform == 'macos'
        run: |
          mkdir -p artifacts
          mv dist/metascrub-gui-macos.dmg artifacts/
          mv metascrub-cli-macos.tar.gz artifacts/

      - name: Stage release files (windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Move-Item dist/metascrub-setup-windows.exe artifacts/
          Move-Item metascrub-cli-windows.zip artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: metascrub-${{ matrix.platform }}
          path: artifacts/*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build .rpm (Fedora/RHEL/openSUSE)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rpm
          bash scripts/build-rpm.sh

      - uses: actions/download-artifact@v4
        with:
          pattern: metascrub-*
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            metascrub-setup-windows.exe
            metascrub-cli-windows.zip
            metascrub-gui-macos.dmg
            metascrub-cli-macos.tar.gz
            metascrub-gui-linux.AppImage
            metascrub_*_amd64.deb
            metascrub-cli-linux.tar.gz
            build/rpm/RPMS/noarch/*.rpm
          generate_release_notes: true
