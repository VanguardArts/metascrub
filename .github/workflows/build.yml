name: Build installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Qt runtime libraries (headless)
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-image0 libxcb-render-util0 \
            libdbus-1-3

      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Run test suite
        run: QT_QPA_PLATFORM=offscreen python -m pytest tests/ -q

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            gui_name: metascrub-gui
          - os: windows-latest
            platform: windows
            gui_name: metascrub-gui.exe
          - os: macos-latest
            platform: macos
            gui_name: metascrub-gui

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[gui] pyinstaller

      - name: Build CLI binary
        run: |
          pyinstaller --onefile --name metascrub-cli packaging/cli_main.py

      - name: Build GUI app
        run: |
          pyinstaller --onefile --windowed --name metascrub-gui packaging/gui_main.py

      - name: Package artifacts (unix)
        if: runner.os != 'Windows'
        run: |
          cd dist
          tar czf ../metascrub-cli-${{ matrix.platform }}.tar.gz metascrub-cli
          if [ "${{ matrix.platform }}" = "macos" ]; then
            ditto -c -k --sequesterRsrc metascrub-gui.app ../metascrub-gui-${{ matrix.platform }}.zip
          else
            tar czf ../metascrub-gui-${{ matrix.platform }}.tar.gz ${{ matrix.gui_name }}
          fi

      - name: Package artifacts (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive dist/metascrub-cli.exe metascrub-cli-windows.zip
          Compress-Archive dist/metascrub-gui.exe metascrub-gui-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: metascrub-${{ matrix.platform }}
          path: |
            metascrub-cli-${{ matrix.platform }}.*
            metascrub-gui-${{ matrix.platform }}.*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: metascrub-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            metascrub-cli-*
            metascrub-gui-*
          generate_release_notes: true
